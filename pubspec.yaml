name: speakright
description: "SpeakRight English — offline speaking practice, no LLM, no server."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.3
  # Added for the student voice-playback feature: `record` captures the
  # student's own audio alongside the existing speech_to_text scoring flow
  # (which only transcribes live and never keeps the audio itself), and
  # `audioplayers` plays that recording back. `path_provider` gives us a
  # writable temp folder to save each take to. These are strictly additive
  # — see StudentRecorder's header comment for why this never touches
  # student_mic.dart's own hardened listen/retry logic.
  record: ^7.1.1
  audioplayers: ^6.8.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/module2/bottle_spirit.png

# Study-themed app icon (graduation cap) so the app reads clearly as an
# English-learning app for school/college students. Generated into every
# Android launcher size by `dart run flutter_launcher_icons` in the build
# workflow.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 23
