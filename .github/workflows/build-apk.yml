name: Build SpeakRight APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo (our lib/, pubspec.yaml, assets/)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter doctor (diagnostics)
        run: flutter doctor -v

      # We scaffold a brand-new Flutter Android project with the tool itself,
      # so every Gradle/Kotlin/AGP version pairing is guaranteed correct for
      # whichever Flutter version this runner installs — then we overlay our
      # own app code on top. This avoids hand-maintained native build files.
      - name: Scaffold a fresh Flutter Android project
        run: flutter create --platforms=android --project-name speakright --org com.speakright build_app

      - name: Overlay our app code onto the fresh scaffold
        run: |
          rm -rf build_app/lib
          cp -r source/lib build_app/lib
          cp source/pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/assets
          cp -r source/assets build_app/assets

      - name: Download the offline Vosk speech model (~40MB, English, small)
        run: |
          mkdir -p build_app/assets/models
          rm -f build_app/assets/models/README.txt
          curl -L --fail --retry 3 -o build_app/assets/models/vosk-model-small-en-us-0.15.zip \
            https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          ls -lh build_app/assets/models/

      - name: Add microphone permission to AndroidManifest.xml
        run: |
          python3 - <<'PY'
          import re
          path = "build_app/android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          if "RECORD_AUDIO" not in content:
              content = re.sub(
                  r"(<manifest[^>]*>)",
                  r'\1\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
                  content,
                  count=1,
              )
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("--- AndroidManifest.xml ---")
          print(content)
          PY

      - name: Set minSdk/compileSdk (required by the offline voice package)
        run: |
          python3 - <<'PY'
          import glob, os
          # Instead of trying to find-and-replace the auto-generated lines
          # (fragile — exact wording/spacing changes between Flutter
          # versions and a regex attempt silently failed to match earlier),
          # we just APPEND a second "android { ... }" block at the end of
          # the file. Gradle (both the Kotlin DSL .kts and classic Groovy
          # .gradle forms) lets you call the android {} block more than
          # once in the same file — each call re-enters the same
          # extension, so a later assignment simply overrides the earlier
          # one. This guarantees these values end up correct no matter
          # what the generated file originally said.
          #   - minSdk 30: vosk_flutter_2 (offline speech) requires it.
          #   - compileSdk 36: vosk_flutter_2's own androidx dependencies
          #     (fragment, window, activity, lifecycle, core, etc.) require
          #     compiling against API 34+; Gradle's own error suggested 36.
          candidates = glob.glob("build_app/android/app/build.gradle*")
          for path in candidates:
              is_kts = path.endswith(".kts")
              snippet = (
                  '\nandroid {\n    compileSdk = 36\n    defaultConfig {\n        minSdk = 30\n    }\n}\n'
                  if is_kts else
                  '\nandroid {\n    compileSdkVersion 36\n    defaultConfig {\n        minSdkVersion 30\n    }\n}\n'
              )
              with open(path, "a", encoding="utf-8") as f:
                  f.write(snippet)
              print(f"Appended minSdk/compileSdk override to {path}")
              with open(path, "r", encoding="utf-8") as f:
                  print(f.read())
          PY

      - name: flutter pub get
        working-directory: build_app
        run: flutter pub get

      - name: Fix missing "namespace" in older plugins (AGP8 compatibility)
        run: |
          python3 - <<'PY'
          import re, glob, os
          pub_cache = os.path.expanduser("~/.pub-cache/hosted/pub.dev")
          gradle_files = glob.glob(os.path.join(pub_cache, "*", "android", "build.gradle"))
          for gradle_path in gradle_files:
              with open(gradle_path, "r", encoding="utf-8") as f:
                  content = f.read()
              if "namespace" in content:
                  continue
              manifest_path = os.path.join(os.path.dirname(gradle_path), "src", "main", "AndroidManifest.xml")
              if not os.path.exists(manifest_path):
                  continue
              with open(manifest_path, "r", encoding="utf-8") as f:
                  manifest = f.read()
              m = re.search(r'package="([^"]+)"', manifest)
              if not m:
                  continue
              package_name = m.group(1)
              new_content = re.sub(r"(android\s*\{)", "\\1\n    namespace '%s'" % package_name, content, count=1)
              if new_content != content:
                  with open(gradle_path, "w", encoding="utf-8") as f:
                      f.write(new_content)
                  print(f"Patched namespace={package_name} into {gradle_path}")
          PY

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeakRight-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
