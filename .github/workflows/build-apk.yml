name: Build SpeakRight APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo (our lib/, pubspec.yaml, assets/)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter doctor (diagnostics)
        run: flutter doctor -v

      # We scaffold a brand-new Flutter Android project with the tool itself,
      # so every Gradle/Kotlin/AGP version pairing is guaranteed correct for
      # whichever Flutter version this runner installs — then we overlay our
      # own app code on top. This avoids hand-maintained native build files.
      - name: Scaffold a fresh Flutter Android project
        run: flutter create --platforms=android --project-name speakright --org com.speakright build_app

      - name: Overlay our app code onto the fresh scaffold
        run: |
          rm -rf build_app/lib
          cp -r source/lib build_app/lib
          cp source/pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/assets
          cp -r source/assets build_app/assets

      - name: Download the offline Vosk speech model (~40MB, English, small)
        run: |
          mkdir -p build_app/assets/models
          rm -f build_app/assets/models/README.txt
          curl -L --fail --retry 3 -o build_app/assets/models/vosk-model-small-en-us-0.15.zip \
            https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          ls -lh build_app/assets/models/

      - name: Add microphone permission to AndroidManifest.xml
        run: |
          python3 - <<'PY'
          import re
          path = "build_app/android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          if "RECORD_AUDIO" not in content:
              content = re.sub(
                  r"(<manifest[^>]*>)",
                  r'\1\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
                  content,
                  count=1,
              )
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("--- AndroidManifest.xml ---")
          print(content)
          PY

      - name: Set minSdkVersion to 23 (required by the offline voice packages)
        run: |
          python3 - <<'PY'
          import re, glob
          candidates = glob.glob("build_app/android/**/build.gradle*", recursive=True)
          for path in candidates:
              if "android/app/build.gradle" not in path.replace("\\", "/"):
                  continue
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              # [ \t] (never \s) so the match can't cross a newline, and the
              # negative lookbehind skips "flutter.minSdkVersion" — matching
              # that by accident is what merged two lines into one earlier.
              new_content = re.sub(r"(?<!\.)\bminSdkVersion[ \t]+\S+", "minSdkVersion 23", content)
              new_content = re.sub(r"(?<!\.)\bminSdk[ \t]*=[ \t]*\S+", "minSdk = 23", new_content)
              if new_content != content:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(new_content)
                  print(f"Patched {path}")
          PY

      - name: flutter pub get
        working-directory: build_app
        run: flutter pub get

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeakRight-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
