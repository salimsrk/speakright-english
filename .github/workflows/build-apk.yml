name: Build SpeakRight APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo (our lib/, pubspec.yaml, assets/)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter doctor (diagnostics)
        run: flutter doctor -v

      # We scaffold a brand-new Flutter Android project with the tool itself,
      # so every Gradle/Kotlin/AGP version pairing is guaranteed correct for
      # whichever Flutter version this runner installs — then we overlay our
      # own app code on top. This avoids hand-maintained native build files.
      - name: Scaffold a fresh Flutter Android project
        run: flutter create --platforms=android --project-name speakright --org com.speakright build_app

      - name: Overlay our app code onto the fresh scaffold
        run: |
          rm -rf build_app/lib
          cp -r source/lib build_app/lib
          cp source/pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/assets
          cp -r source/assets build_app/assets

      - name: Download the offline Vosk speech model (~40MB, English, small)
        run: |
          mkdir -p build_app/assets/models
          rm -f build_app/assets/models/README.txt
          curl -L --fail --retry 3 -o build_app/assets/models/vosk-model-small-en-us-0.15.zip \
            https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          ls -lh build_app/assets/models/

      - name: Add microphone permission to AndroidManifest.xml
        run: |
          python3 - <<'PY'
          import re
          path = "build_app/android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          if "RECORD_AUDIO" not in content:
              content = re.sub(
                  r"(<manifest[^>]*>)",
                  r'\1\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
                  content,
                  count=1,
              )
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("--- AndroidManifest.xml ---")
          print(content)
          PY

      - name: Add a crash-guard so a background-thread voice hiccup can't kill the whole app
        run: |
          python3 - <<'PY'
          import re, glob, os

          # ROOT CAUSE of "press the mic button and the whole app closes":
          # the offline voice library (vosk-android, wrapped by
          # vosk_flutter_2) records audio on its own background Java
          # Thread (RecognizerThread) with no exception handling of its
          # own. If that thread ever hits a transient audio-read hiccup
          # (nread < 0), it throws a plain RuntimeException on that
          # thread. Android's default behavior for an uncaught exception
          # on *any* thread — not just the main/UI thread — is to kill
          # the entire app process. That's why lessons/playback (which
          # never touch that thread) work fine, but the moment "Your
          # turn" starts real microphone recording, a single hiccup on
          # that background thread takes the whole app down with it.
          #
          # Fix: install a global default uncaught-exception handler in
          # a custom Application class. If the crash is on the main
          # thread, we still let Android handle it normally (a real,
          # unrecoverable app bug should still surface). If it's on any
          # other (background) thread — like the voice engine's — we log
          # it and let the app keep running instead of dying. The
          # lesson screen's own 8-second timeout already shows the
          # student a "didn't catch that, try again" message whenever a
          # listening attempt doesn't finish normally, so nothing is
          # silently lost — the app just no longer dies with it.
          manifest_path = "build_app/android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              manifest = f.read()

          candidates = (
              glob.glob("build_app/android/app/src/main/kotlin/**/MainActivity.kt", recursive=True)
              + glob.glob("build_app/android/app/src/main/java/**/MainActivity.java", recursive=True)
              + glob.glob("build_app/android/app/src/main/java/**/MainActivity.kt", recursive=True)
          )

          if candidates:
              main_activity_path = candidates[0]
              src_dir = os.path.dirname(main_activity_path)
              with open(main_activity_path, "r", encoding="utf-8") as f:
                  first_line = f.readline()
              m = re.search(r'package\s+([\w.]+)', first_line)
              package_name = m.group(1) if m else "com.speakright.speakright"

              app_kt_template = '''package __PACKAGE__

          import android.app.Application
          import android.util.Log

          class SpeakRightApplication : Application() {
              override fun onCreate() {
                  super.onCreate()
                  val previousHandler = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { thread, throwable ->
                      if (thread.name == "main") {
                          previousHandler?.uncaughtException(thread, throwable)
                      } else {
                          Log.e("SpeakRight", "Recovered from a background-thread crash on ${thread.name}", throwable)
                      }
                  }
              }
          }
          '''
              app_kt = app_kt_template.replace("__PACKAGE__", package_name)
              out_path = os.path.join(src_dir, "SpeakRightApplication.kt")
              with open(out_path, "w", encoding="utf-8") as f:
                  f.write(app_kt)
              print(f"Created {out_path} (package {package_name})")

              if 'android:name="${applicationName}"' in manifest:
                  manifest = manifest.replace('android:name="${applicationName}"', 'android:name=".SpeakRightApplication"')
              elif "SpeakRightApplication" not in manifest:
                  manifest = re.sub(r"(<application\b)", r'\1 android:name=".SpeakRightApplication"', manifest, count=1)
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(manifest)
              print("--- AndroidManifest.xml (after crash-guard patch) ---")
              print(manifest)
          else:
              print("WARNING: MainActivity not found — skipping crash-guard Application class")
          PY

      - name: Set minSdk/compileSdk (required by the offline voice package)
        run: |
          python3 - <<'PY'
          import glob, os
          # Instead of trying to find-and-replace the auto-generated lines
          # (fragile — exact wording/spacing changes between Flutter
          # versions and a regex attempt silently failed to match earlier),
          # we just APPEND a second "android { ... }" block at the end of
          # the file. Gradle (both the Kotlin DSL .kts and classic Groovy
          # .gradle forms) lets you call the android {} block more than
          # once in the same file — each call re-enters the same
          # extension, so a later assignment simply overrides the earlier
          # one. This guarantees these values end up correct no matter
          # what the generated file originally said.
          #   - minSdk 30: vosk_flutter_2 (offline speech) requires it.
          #   - compileSdk 36: vosk_flutter_2's own androidx dependencies
          #     (fragment, window, activity, lifecycle, core, etc.) require
          #     compiling against API 34+; Gradle's own error suggested 36.
          candidates = glob.glob("build_app/android/app/build.gradle*")
          for path in candidates:
              is_kts = path.endswith(".kts")
              snippet = (
                  '\nandroid {\n    compileSdk = 36\n    defaultConfig {\n        minSdk = 30\n    }\n}\n'
                  if is_kts else
                  '\nandroid {\n    compileSdkVersion 36\n    defaultConfig {\n        minSdkVersion 30\n    }\n}\n'
              )
              with open(path, "a", encoding="utf-8") as f:
                  f.write(snippet)
              print(f"Appended minSdk/compileSdk override to {path}")
              with open(path, "r", encoding="utf-8") as f:
                  print(f.read())
          PY

      - name: flutter pub get
        working-directory: build_app
        run: flutter pub get

      - name: Patch outdated Android config in older plugins (namespace + compileSdk)
        run: |
          python3 - <<'PY'
          import re, glob, os
          pub_cache = os.path.expanduser("~/.pub-cache/hosted/pub.dev")
          gradle_files = glob.glob(os.path.join(pub_cache, "*", "android", "build.gradle"))
          for gradle_path in gradle_files:
              with open(gradle_path, "r", encoding="utf-8") as f:
                  content = f.read()
              original = content
              changes = []

              # 1) AGP8 requires every Android library module to declare a
              #    namespace. Older plugins (like vosk_flutter_2, last
              #    published Oct 2023) predate this and don't have one —
              #    pull it from that same plugin's own AndroidManifest.xml.
              if "namespace" not in content:
                  manifest_path = os.path.join(os.path.dirname(gradle_path), "src", "main", "AndroidManifest.xml")
                  if os.path.exists(manifest_path):
                      with open(manifest_path, "r", encoding="utf-8") as f:
                          manifest = f.read()
                      m = re.search(r'package="([^"]+)"', manifest)
                      if m:
                          package_name = m.group(1)
                          content = re.sub(r"(android\s*\{)", "\\1\n    namespace '%s'" % package_name, content, count=1)
                          changes.append(f"namespace={package_name}")

              # 2) Some of these plugins hard-code an old compileSdk inside
              #    their OWN build.gradle (vosk_flutter_2 uses the newer
              #    "compileSdk 29" form, no "Version" suffix — matching only
              #    "compileSdkVersion" earlier silently missed it). Their
              #    androidx dependencies now require compiling against 34+,
              #    and bumping our app's compileSdk alone doesn't change
              #    this — the plugin's own module needs it raised too.
              m = re.search(r'\bcompileSdk(?:Version)?\s+(\d+)', content)
              if m and int(m.group(1)) < 36:
                  content = re.sub(r'\bcompileSdk(?:Version)?\s+\d+', 'compileSdk 36', content)
                  changes.append(f"compileSdk {m.group(1)}->36")

              if content != original:
                  with open(gradle_path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"Patched {gradle_path}: {', '.join(changes)}")
          PY

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeakRight-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
